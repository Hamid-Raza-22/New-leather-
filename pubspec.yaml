name: new_leather
description: "New Leather srl \u2014 editorial Flutter Web site."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Editorial serif + UI sans, loaded via google_fonts.
  google_fonts: ^8.1.0

  # mailto:, maps and Instagram links.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/brand/
    - assets/images/hero/
    - assets/images/leather/
    - assets/images/textures/
    - assets/images/colors/
    - assets/images/fashion/
    - assets/images/team/
    - assets/images/process/
    - assets/images/events/
    - assets/images/gallery/
